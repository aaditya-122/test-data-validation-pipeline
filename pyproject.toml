[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "test-data-validation-pipeline"
version = "1.0.0"
description = "Faker data generation, validation, reporting, and optional PostgreSQL persistence"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["Faker>=25.0", "psycopg[binary]>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
data-pipeline = "data_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
